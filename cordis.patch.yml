# dsh-prompt-enhance bundle patch.
# Registered through the profile's `dsh.profile.bundles` list; the row below is
# what actually mounts the plugin into the composition.
- insert:
    - id: prompt-enhance
      name: 'dsh-prompt-enhance'
      config:
        # Leave empty to auto-detect (workspace registry -> server cwd).
        workspaceRoot: ''
        # Leave empty to follow the session default model (dsh-agent-default-model).
        provider: ''
        model: ''
        maxPromptChars: 12000
        # Document text budget for the doc-fill style.
        maxDocumentChars: 16000
        maxWorkspaceBytes: 60000
        maxWorkspaceFiles: 40
        # Per-file excerpt length quoted into the workspace digest.
        maxExcerptChars: 3500
        # Heuristic security scan: files inspected and bytes read.
        maxScanFiles: 60
        maxScannedBytes: 921600
        # Files visited when ranking candidate documents.
        maxListedDocuments: 800
        maxOutputTokens: 8000
        requestTimeoutMs: 180000
