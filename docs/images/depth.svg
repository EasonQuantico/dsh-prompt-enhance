<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 470" width="1240" height="470" role="img">
<style>
  text { font-family: 'PingFang SC','Hiragino Sans GB','Microsoft YaHei','Noto Sans CJK SC',system-ui,sans-serif; }
  .mono { font-family: ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .title { fill: #eceef1; font-size: 21px; font-weight: 600; }
  .sub { fill: #7f8690; font-size: 13px; }
  .label { fill: #7f8690; font-size: 11.5px; letter-spacing: .04em; }
  .h { fill: #eceef1; font-size: 15px; font-weight: 600; }
  .b { fill: #aeb4bd; font-size: 12.5px; }
  .b2 { fill: #7f8690; font-size: 12px; }
  .n { fill: #ffffff; font-size: 12px; font-weight: 600; }
  .card { fill: #1b1d21; stroke: #3a3e46; }
  .soft { fill: #23262b; stroke: #2b2f36; }
</style>
<rect width="1240" height="470" rx="16" fill="#111214"/>
<text x="44" y="52" class="title" text-anchor="start">三档篇幅：Superpowers 严谨档是标尺</text>
<text x="44" y="78" class="sub" text-anchor="start">同一个请求只差长度：简洁约严谨档的三分之一，默认约三分之二；数字都是中文字符预算</text>
<rect x="44" y="106" width="816" height="104" rx="14" class="card"/>
<text x="60" y="130" class="h" text-anchor="start">简洁</text>
<text x="120" y="130" class="b2" text-anchor="start">≈ 严谨档的 1/3</text>
<text x="816" y="130" class="mono b2" text-anchor="end">4200 × 0.34 ≈ 1428</text>
<text x="60" y="153" class="b2" text-anchor="start">Superpowers</text>
<rect x="200" y="144.5" width="560" height="9" rx="4.5" fill="#16181c" stroke="#2b2f36" stroke-width="1"/>
<rect x="200" y="144.5" width="190.4" height="9" rx="4.5" fill="#5884ff"/>
<text x="816" y="153" class="mono b" text-anchor="end">1428</text>
<text x="60" y="170" class="b2" text-anchor="start">Prompt Optimizer</text>
<rect x="200" y="161.5" width="560" height="9" rx="4.5" fill="#16181c" stroke="#2b2f36" stroke-width="1"/>
<rect x="200" y="161.5" width="137.1" height="9" rx="4.5" fill="#3d5a9e"/>
<text x="816" y="170" class="mono b2" text-anchor="end">1028</text>
<text x="60" y="187" class="b2" text-anchor="start">LangGPT</text>
<rect x="200" y="178.5" width="560" height="9" rx="4.5" fill="#16181c" stroke="#2b2f36" stroke-width="1"/>
<rect x="200" y="178.5" width="140.9" height="9" rx="4.5" fill="#3d5a9e"/>
<text x="816" y="187" class="mono b2" text-anchor="end">1057</text>
<text x="60" y="204" class="b2" text-anchor="start">AiShort</text>
<rect x="200" y="195.5" width="560" height="9" rx="4.5" fill="#16181c" stroke="#2b2f36" stroke-width="1"/>
<rect x="200" y="195.5" width="104.7" height="9" rx="4.5" fill="#3d5a9e"/>
<text x="816" y="204" class="mono b2" text-anchor="end">785</text>
<rect x="44" y="217" width="816" height="104" rx="14" class="card"/>
<text x="60" y="241" class="h" text-anchor="start">默认</text>
<text x="120" y="241" class="b2" text-anchor="start">≈ 严谨档的 2/3</text>
<text x="816" y="241" class="mono b2" text-anchor="end">4200 × 0.64 ≈ 2688</text>
<text x="60" y="264" class="b2" text-anchor="start">Superpowers</text>
<rect x="200" y="255.5" width="560" height="9" rx="4.5" fill="#16181c" stroke="#2b2f36" stroke-width="1"/>
<rect x="200" y="255.5" width="358.4" height="9" rx="4.5" fill="#5884ff"/>
<text x="816" y="264" class="mono b" text-anchor="end">2688</text>
<text x="60" y="281" class="b2" text-anchor="start">Prompt Optimizer</text>
<rect x="200" y="272.5" width="560" height="9" rx="4.5" fill="#16181c" stroke="#2b2f36" stroke-width="1"/>
<rect x="200" y="272.5" width="258.0" height="9" rx="4.5" fill="#3d5a9e"/>
<text x="816" y="281" class="mono b2" text-anchor="end">1935</text>
<text x="60" y="298" class="b2" text-anchor="start">LangGPT</text>
<rect x="200" y="289.5" width="560" height="9" rx="4.5" fill="#16181c" stroke="#2b2f36" stroke-width="1"/>
<rect x="200" y="289.5" width="265.2" height="9" rx="4.5" fill="#3d5a9e"/>
<text x="816" y="298" class="mono b2" text-anchor="end">1989</text>
<text x="60" y="315" class="b2" text-anchor="start">AiShort</text>
<rect x="200" y="306.5" width="560" height="9" rx="4.5" fill="#16181c" stroke="#2b2f36" stroke-width="1"/>
<rect x="200" y="306.5" width="197.1" height="9" rx="4.5" fill="#3d5a9e"/>
<text x="816" y="315" class="mono b2" text-anchor="end">1478</text>
<rect x="44" y="328" width="816" height="104" rx="14" class="card" stroke="#4c5d86" stroke-width="1.6"/>
<text x="60" y="352" class="h" text-anchor="start">严谨</text>
<text x="120" y="352" class="b2" text-anchor="start">标尺本身，× 1</text>
<text x="816" y="352" class="mono b2" text-anchor="end">4200 × 1 ≈ 4200</text>
<text x="60" y="375" class="b2" text-anchor="start">Superpowers</text>
<rect x="200" y="366.5" width="560" height="9" rx="4.5" fill="#16181c" stroke="#2b2f36" stroke-width="1"/>
<rect x="200" y="366.5" width="560.0" height="9" rx="4.5" fill="#5884ff"/>
<text x="816" y="375" class="mono b" text-anchor="end">4200</text>
<text x="60" y="392" class="b2" text-anchor="start">Prompt Optimizer</text>
<rect x="200" y="383.5" width="560" height="9" rx="4.5" fill="#16181c" stroke="#2b2f36" stroke-width="1"/>
<rect x="200" y="383.5" width="403.2" height="9" rx="4.5" fill="#3d5a9e"/>
<text x="816" y="392" class="mono b2" text-anchor="end">3024</text>
<text x="60" y="409" class="b2" text-anchor="start">LangGPT</text>
<rect x="200" y="400.5" width="560" height="9" rx="4.5" fill="#16181c" stroke="#2b2f36" stroke-width="1"/>
<rect x="200" y="400.5" width="414.4" height="9" rx="4.5" fill="#3d5a9e"/>
<text x="816" y="409" class="mono b2" text-anchor="end">3108</text>
<text x="60" y="426" class="b2" text-anchor="start">AiShort</text>
<rect x="200" y="417.5" width="560" height="9" rx="4.5" fill="#16181c" stroke="#2b2f36" stroke-width="1"/>
<rect x="200" y="417.5" width="308.0" height="9" rx="4.5" fill="#3d5a9e"/>
<text x="816" y="426" class="mono b2" text-anchor="end">2310</text>
<rect x="884" y="106" width="312" height="326" rx="14" class="card"/>
<text x="904" y="136" class="h" text-anchor="start">4200 字是标尺</text>
<text x="904" y="162" class="b" text-anchor="start">Superpowers 严谨档的实测成稿长度，</text>
<text x="904" y="182" class="b" text-anchor="start">同一个中等复杂度请求、中文字符。</text>
<text x="904" y="208" class="b" text-anchor="start">其余三家按实测长度比例缩放，</text>
<text x="904" y="228" class="b" text-anchor="start">同一档位下四家的含义才一致。</text>
<line x1="904" y1="246" x2="1176" y2="246" stroke="#2b2f36" stroke-width="1" />
<text x="904" y="268" class="label" text-anchor="start">实测长度比例（Superpowers = 1）</text>
<text x="904" y="294" class="b" text-anchor="start">Prompt Optimizer</text>
<text x="1176" y="294" class="mono b2" text-anchor="end">0.72</text>
<text x="904" y="318" class="b" text-anchor="start">LangGPT</text>
<text x="1176" y="318" class="mono b2" text-anchor="end">0.74</text>
<text x="904" y="342" class="b" text-anchor="start">AiShort</text>
<text x="1176" y="342" class="mono b2" text-anchor="end">0.55</text>
<line x1="904" y1="366" x2="1176" y2="366" stroke="#2b2f36" stroke-width="1" />
<text x="904" y="388" class="mono b" text-anchor="start">4200 × 0.72 × 0.64 ≈ 1935</text>
<text x="904" y="408" class="b2" text-anchor="start">即默认档的 Prompt Optimizer</text>
<text x="44" y="458" class="label" text-anchor="start">每行三段的横轴等长 = 同一把 4200 字标尺；条长即预算，右侧数字可直接引用。四家行序固定，便于逐档横读。</text>
</svg>
